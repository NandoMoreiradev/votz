services:
  matrix-data-init:
    image: ghcr.io/element-hq/synapse:v1.165.0
    user: "0"
    entrypoint: ["chown", "991:991", "/data"]
    volumes: ["votz_matrix_data:/data"]
    restart: "no"
  matrix:
    image: ghcr.io/element-hq/synapse:v1.165.0
    container_name: votz-matrix
    restart: unless-stopped
    depends_on:
      matrix-data-init:
        condition: service_completed_successfully
    ports: ["127.0.0.1:8008:8008"]
    volumes:
      - votz_matrix_data:/data
      - ./.local/chat/homeserver.yaml:/data/homeserver.yaml:ro
      - ./.local/chat/log.config:/data/log.config:ro
    networks: [votz]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 10
networks:
  votz:
    external: true
    name: votz_default
volumes:
  votz_matrix_data:
