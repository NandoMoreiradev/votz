services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: votz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: votz
      POSTGRES_PASSWORD: votz
      POSTGRES_DB: votz
    ports:
      - "5432:5432"
    volumes:
      - votz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: votz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - votz_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/silo:latest
    container_name: votz-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${CLOUDFLARE_R2_ACCESS_KEY:-votzminio}
      MINIO_ROOT_PASSWORD: ${CLOUDFLARE_R2_SECRET_KEY:-votzminio123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - votz_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: pgsty/silo:latest
    container_name: votz-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${CLOUDFLARE_R2_ACCESS_KEY:-votzminio}
      MINIO_ROOT_PASSWORD: ${CLOUDFLARE_R2_SECRET_KEY:-votzminio123}
      MINIO_BUCKET: ${CLOUDFLARE_R2_BUCKET:-votz-media}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/"$$MINIO_BUCKET" &&
        mc anonymous set download local/"$$MINIO_BUCKET"/avatars &&
        mc anonymous set download local/"$$MINIO_BUCKET"/reports &&
        mc anonymous set download local/"$$MINIO_BUCKET"/entities &&
        mc anonymous set download local/"$$MINIO_BUCKET"/comments &&
        mc anonymous set none local/"$$MINIO_BUCKET"/verification
        exit 0

volumes:
  votz_postgres_data:
  votz_redis_data:
  votz_minio_data:
